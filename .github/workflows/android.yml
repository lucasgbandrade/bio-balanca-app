name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Montar o projeto Android
        run: |
          npm run www
          npx cap add android
          npm run android:setup
          npx cap sync android
      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bio-balanca.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bio-balanca-apk
          path: bio-balanca.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bio Balança 1.0.${{ github.run_number }}
          body: App Android do Bio Balança. Baixe o arquivo bio-balanca.apk no celular e instale.
          files: bio-balanca.apk
          make_latest: true
